<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17140f">
<title>الطريق إلى طرابلس</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: big overall road strip to Tripoli, then prayer card, actions, per-leg rows (only the active one lit), trip log, adhkar */
:root{
  --sand:#f3ece0; --ink:#2b2418; --dune:#c9a86a; --road:#3a3328; --line:#f6e7b0; --muted:#7a6a52; --ok:#2f7d4f; --warn:#a4561d; --card:#fbf7ef;
  --display:"Tajawal","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;
  --quran:"Amiri","Noto Naskh Arabic","Traditional Arabic",serif;
  --num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --sand:#17140f; --ink:#f1e8d6; --dune:#d8b671; --road:#0b0a07; --line:#e8d48f; --muted:#a8977a; --ok:#5fbf86; --warn:#e39a5c; --card:#211d16; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:var(--display);
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(90px,calc(env(safe-area-inset-bottom) + 90px)) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:18px;max-width:640px;margin-inline:auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:1.05rem;font-weight:700;color:var(--muted)}
.chip{background:var(--card);border-radius:999px;padding:5px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}
.pct{font-weight:900;font-size:clamp(4.2rem,22vw,7.5rem);line-height:.9;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.pct small{font-size:.4em;color:var(--dune)}
.ends{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-bottom:6px}
.ends b{color:var(--ink);display:block;font-size:1rem}
.road{position:relative;height:44px;background:var(--road);border-radius:6px;overflow:hidden}
.road::after{content:"";position:absolute;inset:50% 0 auto;height:3px;margin-top:-1.5px;
  background:repeating-linear-gradient(to left,var(--line) 0 18px,transparent 18px 34px);opacity:.5}
.fill{position:absolute;inset:0 0 0 auto;width:0;background:linear-gradient(to left,var(--dune),#e0bf7d);transition:width 1.2s ease}
.car{position:absolute;top:50%;right:0;transform:translate(50%,-50%);width:28px;height:28px;border-radius:50%;
  background:var(--card);border:3px solid var(--ink);transition:right 1.2s ease;z-index:2}
.ticks{position:absolute;inset:0;z-index:1}
